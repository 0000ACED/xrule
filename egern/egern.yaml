  - rule_set:
      match: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/Egern/Rule/AdBlock.yaml
      policy: AdBlock

  # 直连自定义
  - rule_set:
      match: https://raw.githubusercontent.com/0000ACED/xrule/refs/heads/main/egern/rule/direct_custom.list
      policy: DIRECT

  # 国内
  - rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Surge/China/China.list
      policy: DIRECT

  # 局域网与系统直连
  - rule_set:
      match: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/Egern/Rule/Lan.yaml
      policy: DIRECT

  # 苹果服务
  - rule_set:
      match: https://raw.githubusercontent.com/0000ACED/xrule/refs/heads/main/egern/rule/apple_extra.list
      policy: Apple
  - rule_set:
      match: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple.list
      policy: Apple

  # AI 服务
  - rule_set:
      match: https://raw.githubusercontent.com/jnlaoshu/MySelf/main/Egern/Rule/AIGC.yaml
      policy: AIGC

  # 流媒体服务
  # - rule_set:
